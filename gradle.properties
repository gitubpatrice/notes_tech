## JVM Gradle — dimensionné pour la chaîne KSP + Kotlin 2 (identique à Agenda Tech / SMS Tech).
##
## ⚠️ Le tas ne peut PAS être trop grand ici. Avec CompressedOops, le tas Java est projeté dans les
## 32 premiers Go d'espace d'adressage, et le tas **natif** — où vivent le metaspace de KSP/kotlinc,
## ZipFile, le cache de code et le scratch du JIT — grandit EN DESSOUS de sa base. À Xmx=4g, le
## démon meurt en `OutOfMemoryError: malloc failed` pendant KSP. 2 Go suffisent largement et
## libèrent ~2 Go d'espace natif.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -XX:CompressedClassSpaceSize=256m -XX:ReservedCodeCacheSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
## Cache de configuration désactivé tant que le premier build stable n'est pas acquis — plus simple
## à déboguer. À rallumer une fois la phase 2 terminée.
org.gradle.configuration-cache=false
org.gradle.daemon=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

kotlin.code.style=official
kotlin.incremental=true
## Démon du compilateur Kotlin — sa propre JVM, il ne partage pas celle de Gradle.
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8

## KSP 2 — required since AGP 8.13, and the only KSP that runs with AGP 9.
ksp.useKSP2=true

## Lint in its own process, not in the Gradle daemon (AGP 9 migration, 2026-10-10).
##
## Measured on the first AGP 9.4.1 gate: `lintAnalyzeDebugUnitTest` and `lintAnalyzeDebugAndroidTest`
## both died on an internal error of lint's Kotlin analyser ("Error while resolving FirRegularClassImpl
## from RAW_FIR to COMPILER_REQUIRED_ANNOTATIONS", "this is a bug in lint"), while
## `kspDebugAndroidTestKotlin` was running in the same JVM. Lint alone, or after KSP, passed on the same
## sources: a race between two users of the Kotlin compiler inside one process, not a finding. Out of
## process, lint shares nothing with KSP or with its other analyses, so the order the parallel build
## happens to pick no longer decides whether CI is red.
android.experimental.runLintInProcess=false
