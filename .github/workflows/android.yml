name: CI (Kotlin)

# Notes Tech 3.0 is the Kotlin rewrite. This workflow replaces the Flutter ci.yml, and the port's own
# first ci.yml (2026-08, never run: the port had no remote then).
#
# `kotlin`, `fix/**` and `feat/**` are triggers on purpose: a work branch with nothing running on it
# can pile up commits nobody checks (measured on a sibling app: 25 commits, detekt red since the
# morning, unreported).
on:
  push:
    branches: [main, kotlin, 'fix/**', 'feat/**']
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to the same ref cancels the previous run: its result is already stale.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned in app/build.gradle.kts. Installed explicitly rather than left to whatever the runner
  # image happens to carry: two NDKs produce different .so from the same sources.
  NDK_VERSION: "27.0.12077973"
  CMAKE_VERSION: "3.22.1"

jobs:
  gate:
    name: Gate (build · tests · lint · detekt · ktlint)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install the pinned NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null

      # The local gate, in one command, so CI and a developer's machine agree on what "green" means.
      #
      # `compileDebugAndroidTestKotlin`: the gate fails fast when the instrumented source set no longer
      # compiles, without waiting for the emulator job. It happened in 2026-08: a key interface gained
      # a member, five test doubles did not follow, and the instrumented suite could not run without
      # anyone being told.
      - name: Gate
        run: >
          ./gradlew --no-daemon :app:assembleDebug testDebugUnitTest :app:lintDebug detekt ktlintCheck
          :app:compileDebugAndroidTestKotlin

      # Room validates the database when it opens it. Any drift between the entities and the schema the
      # Flutter versions created would show up on the user's phone as a database that refuses to open,
      # so after the update. The script compares, in memory, exactly what Room compares, against the
      # schema KSP has just exported.
      - name: Does the Room schema still match the database the Flutter versions created?
        run: python3 audits/verifier-schema-room-vs-flutter.py

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

  release:
    name: Release build (R8, native code, real applicationId)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install the pinned NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null

      # `-Pnotestech.replaceInstalledApp=true` is what a published build uses: without it the APK is
      # `com.filestech.notes_tech.next`, installed beside Notes Tech. Without keystore.properties (not
      # in the repository, on purpose) the APKs come out unsigned, which is all this job needs: it
      # proves R8 and the NDK build pass, that each split carries versionCode * 10 + ABI, and the
      # universal APK versionCode * 10.
      - name: Build the release splits
        run: ./gradlew --no-daemon :app:assembleRelease -Pnotestech.replaceInstalledApp=true

      - name: Check package and versionCodes
        run: |
          set -euo pipefail
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          BASE=$(sed -n 's/^versionCode=//p' version.properties | tr -d '\r')
          for pair in universal:0 armeabi-v7a:1 arm64-v8a:2 x86_64:3; do
            abi=${pair%%:*}; rank=${pair##*:}
            apk=app/build/outputs/apk/release/app-$abi-release-unsigned.apk
            line=$("$AAPT2" dump badging "$apk" | head -1)
            echo "$abi: $line"
            echo "$line" | grep -q "name='com.filestech.notes_tech' versionCode='$((BASE * 10 + rank))'" \
              || { echo "::error::$abi: expected com.filestech.notes_tech / $((BASE * 10 + rank))"; exit 1; }
          done

  zero-network:
    name: Zero-network promise
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      # Only the manifest merge: it needs no keystore and no R8, and it is the artefact that decides
      # which permissions the published APK carries. The source manifest declares INTERNET only to
      # remove it, so reading it would prove nothing.
      - name: Merge the release manifest
        run: ./gradlew --no-daemon :app:processReleaseMainManifest -Pnotestech.replaceInstalledApp=true

      - name: Assert the permissions of the merged release manifest
        run: python3 tools/check-manifest-permissions.py

  # 🔴 Added in 3.1.1. Until then the instrumented tests (501 on 2026-10-29) ran on phones only, and
  # nothing ran them: the long press that closed 3.1.0 (#36) and the "Translate" that sent a note's
  # text out were both visible only there.
  #
  # An emulator still lacks a hardware Keystore, a fingerprint and the dictation model, so the Gradle
  # task fails whatever happens; `tools/check-instrumented-results.py` judges each test instead, and
  # lets through only what the emulator cannot provide, reason by reason — including the hardware
  # Keystore witness, which MUST fail here with KeystoreSoftwareOnlyException. The screen lock is set
  # first: without one, every PIN-vault test fails for that reason alone.
  #
  # API 29 matches the physical test device (Galaxy S9, Android 10).
  instrumented:
    name: Instrumented tests (emulator, API 29)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install the pinned NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null

      - name: Does the judge still refuse what it must?
        run: python3 tools/check-instrumented-results.py --self-test

      # Built before the emulator boots, so it does not sit idle through the native build.
      - name: Build the app and its tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      # KVM has to be enabled explicitly on GitHub-hosted runners for the emulator to boot.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ⚠️ `connectedDebugAndroidTest` is used HERE ONLY, where the emulator is the sole attached device:
      # it targets EVERY connected device and uninstalls the app at the end. Locally, by serial:
      #   adb -s <serial> shell am instrument -w -r \
      #     com.filestech.notes_tech.next.debug.test/com.filestech.notes_tech.HiltTestRunner
      - name: Run the instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell locksettings set-pin 1234
            adb shell svc power stayon true
            ./gradlew --no-daemon :app:connectedDebugAndroidTest || echo "::notice::the task fails on what the emulator cannot do; the next step judges each test"

      - name: Judge the results, test by test
        run: python3 tools/check-instrumented-results.py app/build/outputs/androidTest-results/connected/debug

      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
          if-no-files-found: ignore
