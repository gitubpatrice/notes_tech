name: CI

# `fix/**` et `feat/**` sont des déclencheurs délibérés.
#
# Toutes les autres applications du portefeuille ne construisent que leur branche par défaut et les
# PR qui la visent : une branche de travail peut donc accumuler des dizaines de commits sans que
# rien ne tourne dessus. Mesuré sur une application voisine : 25 commits, detekt en échec depuis le
# matin, personne au courant. Agenda Tech est le seul dépôt à avoir corrigé ça ; c'est son modèle
# qui est repris ici.
on:
  push:
    branches: [main, 'fix/**', 'feat/**']
  pull_request:
  workflow_dispatch:

concurrency:
  # Un push plus récent sur la même référence annule le précédent : son résultat est déjà périmé.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Gate (build · tests · lint · detekt)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Les outils du gate local en une commande, pour que la CI et le poste du développeur ne
      # puissent jamais diverger sur ce que « vert » veut dire.
      #
      # 🔴 `compileDebugAndroidTestKotlin` en fait partie depuis le 2026-08-15, et il n'y était pas.
      #
      # Le source set instrumenté avait **cessé de compiler** pendant la phase 5 — une interface de
      # clé avait gagné un membre, cinq doubles de test ne l'avaient pas suivi. Les 91 tests
      # instrumentés ne pouvaient donc plus tourner, et rien ne le disait : le gate compile
      # `main` et `test`, pas `androidTest`. Le job d'émulateur plus bas l'aurait vu, mais ce dépôt
      # n'a **aucun remote** — cette CI n'a jamais tourné une seule fois.
      #
      # Compiler ce source set coûte quelques secondes et n'exige ni appareil ni émulateur. C'est le
      # contrôle qui manquait, au seul endroit où il est gratuit.
      - name: Gate
        run: >
          ./gradlew --no-daemon :app:assembleDebug testDebugUnitTest :app:lintDebug detekt
          :app:compileDebugAndroidTestKotlin

      # Le schéma que Room attend doit décrire EXACTEMENT la base créée par la version Flutter.
      # Une divergence ne se verrait qu'à l'ouverture, chez l'utilisateur, sous la forme d'un refus
      # d'ouvrir — donc trop tard. Ce contrôle coûte une seconde et tourne sur le schéma que KSP
      # vient d'exporter, ce qui le rend impossible à oublier après une modification d'entité.
      - name: Le schéma Room décrit-il toujours la base héritée ?
        run: python3 audits/verifier-schema-room-vs-flutter.py

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/schemas/
          retention-days: 14
          if-no-files-found: ignore

  zero-network:
    name: Promesse « zéro réseau »
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Seulement la fusion du manifeste, pas un build release complet : elle n'a besoin ni de
      # keystore ni de R8, et c'est elle qui décide des permissions que portera l'APK publié.
      #
      # ⚠️ `-Pnotestech.replaceInstalledApp=true` : on contrôle le manifeste de l'APK qui sera
      # RÉELLEMENT publié, pas celui de la build isolée de développement. Les deux ne portent pas
      # le même applicationId, donc pas les mêmes permissions auto-générées.
      - name: Fusionner le manifeste release
        run: >
          ./gradlew --no-daemon :app:processReleaseMainManifest
          -Pnotestech.replaceInstalledApp=true

      # L'assertion vit dans un script et non en ligne ici, pour trois raisons : elle analyse le
      # manifeste comme du XML (un grep par ligne rate un `<uses-permission>` écrit sur plusieurs
      # lignes) ; un développeur peut la lancer avant de pousser ; et ses propres chemins d'échec
      # ont été éprouvés plutôt que supposés.
      - name: Contrôler les permissions du manifeste fusionné
        run: python3 tools/check-manifest-permissions.py

  instrumented:
    name: Tests instrumentés (API 29)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 29 pour correspondre à l'appareil de test physique (Galaxy S9), afin qu'une CI verte et
      # un essai local vert veuillent dire la même chose.
      #
      # Ces tests ne peuvent PAS être des tests JVM : ils exercent un vrai SQLCipher, de vrais
      # triggers FTS5 et l'adoption par Room d'une base écrite par une autre application. C'est
      # exactement ce qui décide de la réussite du portage.
      #
      # ⚠️ `connectedDebugAndroidTest` cible TOUS les appareils branchés et efface les données de
      # l'application. Ici l'émulateur est seul, donc c'est sans danger. Sur un poste de
      # développement, fixer la cible :
      #   ANDROID_SERIAL=<numéro de série> ./gradlew :app:connectedDebugAndroidTest
      - name: Tests instrumentés sur émulateur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
          if-no-files-found: ignore
