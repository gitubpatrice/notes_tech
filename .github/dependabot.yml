# Dependency watch for Notes Tech 3 (Kotlin), modelled on Agenda Tech's.
#
# Replaces the Flutter configuration (pub at the root, Gradle under android/), whose directories no
# longer exist. Both ecosystems are watched because GitHub Actions are code run with access to the
# repository too.
version: 2

updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # Grouped: ten separate PRs get closed unread, one grouped PR gets reviewed.
    groups:
      androidx:
        patterns:
          - "androidx.*"
      kotlin-and-tools:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
          - "com.google.dagger*"
          - "io.gitlab.arturbosch.detekt*"
      junit:
        patterns:
          - "org.junit*"
    ignore:
      # Kotlin 2.4.20+: CodeQL 2.27 refuses to compile it ("currently supports versions below 2.4.20",
      # measured on Agenda Tech). A bump PR would fail on every run; the root build.gradle.kts also pins
      # the compiler with `strictly`. Remove once a CodeQL release supports it.
      - dependency-name: "org.jetbrains.kotlin*"
        versions: [">= 2.4.20"]
      # JUnit majors stay a deliberate step (JUnit 6 needs Kotlin 2.2+ and drops deprecated APIs). Minor
      # bumps pass since the platform launcher is declared through the BOM (gradle/libs.versions.toml):
      # before that, ANY version but 5.11.3 discovered no test (PRs #16 and #21).
      - dependency-name: "org.junit*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
