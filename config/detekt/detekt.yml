build:
  maxIssues: 0
  # Left at false deliberately. `excludeCorrectable: true` only filters findings from rules that
  # declare themselves auto-correcting, which requires `formatting.autoCorrect: true` — measured, it
  # excluded nothing here. The layout policy is stated explicitly under `formatting:` instead, where
  # it can be read.
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

processors:
  active: true

console-reports:
  active: true

comments:
  active: true
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
  UndocumentedPublicProperty:
    active: false

complexity:
  active: true
  # Compose composables routinely exceed the JVM-Kotlin "tasteful" thresholds because the
  # UI tree is declarative and lambdas-for-everything is the idiom. The thresholds below are
  # aligned with what Now-In-Android, Tivi, and the Material 3 sample apps tolerate.
  LongMethod:
    active: true
    threshold: 300
  LongParameterList:
    active: true
    # A Compose "…Content" function takes one lambda per user action so it stays stateless and
    # previewable — EventEditorContent is at 26. Hoisting them into a holder object would only move
    # the list somewhere the compiler checks less.
    functionThreshold: 30
    constructorThreshold: 20
  CyclomaticComplexMethod:
    active: true
    threshold: 40
  TooManyFunctions:
    active: true
    # EventEditorViewModel is at 39: one setter per edited field, which is the flat, boring shape a
    # form ViewModel should have. Splitting it would scatter one screen's state across several owners.
    thresholdInClasses: 45
    thresholdInFiles: 35
    thresholdInInterfaces: 20
    thresholdInObjects: 20
  NestedBlockDepth:
    active: true
    threshold: 8

empty-blocks:
  active: true
  EmptyFunctionBlock:
    active: true
    ignoreOverridden: true

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: false

naming:
  active: true
  # The application id is `com.filestech.agenda_tech`, underscore included, and it is the identity
  # Android uses to decide whether an APK is an update of the installed app. Renaming the package to
  # satisfy a style rule would break the update path of every existing installation — so the rule is
  # taught the real name instead. This was 160 of the 520 findings that made the gate red.
  PackageNaming:
    active: true
    packagePattern: '[a-z]+(\.[a-z][A-Za-z0-9_]*)*'
  FunctionNaming:
    functionPattern: '[a-zA-Z][a-zA-Z0-9_]*'
  ClassNaming:
    active: true
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][_A-Z0-9]*'
    propertyPattern: '[A-Za-z][_A-Za-z0-9]*'
    privatePropertyPattern: '_?[A-Za-z][_A-Za-z0-9]*'

performance:
  active: true

potential-bugs:
  active: true
  UnreachableCode:
    active: true

style:
  active: true
  MagicNumber:
    active: false
  MaxLineLength:
    active: true
    maxLineLength: 140
  WildcardImport:
    active: true
  ThrowsCount:
    active: true
    # DatabaseKeyManager maps each distinct Keystore/IO failure to its own typed `Failure`, so the
    # caller can tell "the key is gone for good" from "this attempt failed". One throw per failure
    # class is the point — merging them is exactly the defect that made a transient error wipe the
    # database (audit F1).
    max: 4
  DestructuringDeclarationWithTooManyEntries:
    active: true
    # `val (weeks, days, hours, minutes, seconds) = m.destructured` in DeviceEventMapper — regex group
    # destructuring is the canonical use of `destructured`, and naming the five RFC 5545 duration
    # components is what makes the arithmetic below it readable.
    maxDestructuringEntries: 5
  ReturnCount:
    active: true
    # Left at the value this repo chose. Raising it to 10 for the three guard-clause chains that exceed
    # it (RestoreBackupUseCase.validate, BackupEnvelope.parseHeader, GeoLink.parseCoordinates) was the
    # wrong instrument, and a reviewer was right to call it: ReturnCount describes CONTROL FLOW, not
    # layout, so a global threshold would have stopped reporting any future function with up to ten exit
    # points across all 132 files — to excuse three named ones. Those three carry a targeted
    # `@Suppress("ReturnCount")` with the reason on the spot, exactly like
    # `RecurrenceExpander.occurrenceStarts` does for its loop.
    max: 4
  UnusedPrivateMember:
    active: true
  UnusedImports:
    active: true

formatting:
  active: true
  android: true
  autoCorrect: false
  MaximumLineLength:
    active: false

  # ktlint's package-name rule hard-codes "no underscore" with no configurable pattern. It duplicates
  # `naming.PackageNaming` above, which is taught the real application id. Keeping both active
  # reported the same fact twice, 160 times, and neither report was actionable.
  PackageName:
    active: false

  # ------------------------------------------------------------------------------------------------
  # LAYOUT POLICY — where the ktlint `android: true` preset and this codebase disagree.
  #
  # These are the rules of the preset that assert a *layout taste* the 132 files of this app do not
  # follow, consistently, everywhere: arguments are packed rather than exploded one-per-line, and
  # annotations sit on the declaration line. That is a house style, not a defect — 98 of the 168
  # findings were `ArgumentListWrapping` alone.
  #
  # They are turned off rather than auto-corrected on purpose. Auto-correcting would rewrite the call
  # sites of `IcsCodec`, `DeviceEventMapper` and the editor — precisely the files the security lots
  # are about to change — and would bury those real diffs under a few hundred whitespace lines.
  #
  # This is NOT a baseline. A baseline lists named instances and lets the next one through unnoticed;
  # this names *rules* and says why, so the decision is auditable and the count cannot creep. Every
  # rule that describes a behaviour, and every other rule of this preset, stays active and blocking:
  # `MultiLineIfElse` (missing braces round a multi-line if/else) was FIXED, not silenced, and so were
  # the 10 dead imports.
  #
  # If the house style is ever meant to change, the honest move is one isolated auto-correct commit
  # and deleting this block — not a baseline.
  # ------------------------------------------------------------------------------------------------
  ArgumentListWrapping:
    active: false
  Wrapping:
    active: false
  ParameterListWrapping:
    active: false
  ParameterWrapping:
    active: false
  PropertyWrapping:
    active: false
  AnnotationOnSeparateLine:
    active: false
  SpacingBetweenDeclarationsWithAnnotations:
    active: false
  SpacingBetweenDeclarationsWithComments:
    active: false
  ImportOrdering:
    active: false
  NoConsecutiveBlankLines:
    active: false
