# Source unique de la version. Lue par `app/build.gradle.kts`, sans repli : une version fausse
# casse la mise à jour chez l'utilisateur (Android refuse un versionCode qui baisse), donc mieux
# vaut un build qui échoue bruyamment qu'un APK publié avec un versionCode silencieusement erroné.
#
# Continuité avec la lignée Flutter — le versionCode ne repart PAS de zéro :
#   51 = Notes Tech 2.0.3, dernière version Flutter publiée
#   52 = réservé à la release passerelle 2.0.4 (re-scellage de la KEK, cf. docs/03-KEK-ACQUISITION.md)
#   53 = première release Kotlin
#
# ⚠️ Ne pas publier tant que la phase 8 (parité) n'est pas close. Le suffixe `-alpha` sur le
# versionName ne protège de rien : c'est le versionCode qu'Android regarde.
versionCode=53
versionName=3.0.0-alpha01
