# Source unique de la version. Lue par `app/build.gradle.kts`, sans repli : une version fausse
# casse la mise à jour chez l'utilisateur (Android refuse un versionCode qui baisse), donc mieux
# vaut un build qui échoue bruyamment qu'un APK publié avec un versionCode silencieusement erroné.
#
# Continuité avec la lignée Flutter — le versionCode ne repart PAS de zéro :
#   51 = Notes Tech 2.0.3, dernière version Flutter publiée
#   52 = réservé à la release passerelle 2.0.4 (re-scellage de la KEK, cf. docs/03-KEK-ACQUISITION.md)
#   53 = first Kotlin release, as planned on 2026-08-13 — SUPERSEDED, see below
#
# Phase 8 (parity) closed, security audit done, running-in done (2026-09-26 to 10-05): the
# `-alpha01` suffix was dropped on 2026-10-05. It never protected anything: Android only looks at
# the versionCode.
#
# 2026-09-24 — the base moves from 53 to 500, and the per-ABI scheme changes with it.
#
# The Flutter line kept shipping after the lines above were written: 2.0.5 (53), 2.0.6 (54),
# 2.0.7 (55), then F-Droid imposed `base * 10 + ABI` (fdroiddata!37885, 2026-09-13) and Flutter
# jumped to 406 for 2.0.8 and 407 for 2.0.9 — published as 4071/4072/4073. The 3.0.0 built from
# `53` produced 1053/2053/3053: BELOW every installed release, so Android would have refused it.
#
# 500 is a clean step above the whole 2.0.x line, and leaves 408..499 to any Flutter bug-fix
# release shipped during the transition. ⚠️ Before publishing, compare with the LAST published
# Flutter tag, not with this comment: the base must stay above it.
versionCode=501
versionName=3.1.0
